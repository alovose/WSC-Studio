<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WSC Studio Web</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0d1410;--panel:#141d18;--line:#29362e;--muted:#9aa89f;--lime:#c8f169}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4ef;font:14px "Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#111a15;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px}.brand{color:var(--lime);font-size:18px;font-weight:700;padding:6px}.nav{display:grid;gap:6px}.nav button,.btn{border:1px solid #34443a;background:#17211b;color:#edf4ef;padding:10px;border-radius:7px;text-align:left}.nav button.active{background:#29382e;color:var(--lime)}.main{min-width:0}.top{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:24px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;margin:14px 0}.input{background:var(--panel);color:#fff;border:1px solid #34443a;border-radius:7px;padding:10px;min-width:0}.toolbar .input:first-child{flex:1}.primary{background:var(--lime);color:#162016;border:0;font-weight:700}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel);max-height:70vh}.table{border-collapse:collapse;white-space:nowrap;min-width:100%;font-size:13px}.table th,.table td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);max-width:260px;overflow:hidden;text-overflow:ellipsis}.table th{position:sticky;top:0;background:#202b24;color:var(--lime);cursor:pointer}.table tr:hover{background:#1b2820}.rowactions{display:flex;gap:5px}.rowactions button{padding:6px 8px}.status{padding:9px 24px;border-top:1px solid var(--line);color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:16px;z-index:3}.modal.open{display:grid}.box{width:min(850px,100%);max-height:92vh;overflow:auto;background:#111a15;border:1px solid var(--line);border-radius:10px}.box header,.box footer{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.box footer{border:0;border-top:1px solid var(--line);justify-content:end;gap:8px}.fields{padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field input{width:100%}.notice{background:#1b2820;border:1px solid var(--line);padding:14px;border-radius:9px;line-height:1.5;margin-bottom:14px}.hidden{display:none!important}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:16px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.content{padding:14px}.fields{grid-template-columns:1fr 1fr}.top{padding:12px}.status{padding:8px 14px}}@media(max-width:480px){.fields{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">◈ WSC STUDIO <small style="display:block;color:#9aa89f;font-weight:400">Editor web · APK/SQLite</small></div><nav class="nav" id="nav"><button data-kind="Club" class="active">♧ Equipos</button><button data-kind="Competition">◉ Competiciones</button><button data-kind="Player">♙ Jugadores</button><button data-kind="access">↕ Ascensos y plazas</button></nav><div style="margin-top:auto;display:grid;gap:8px"><button class="btn primary" id="open">Abrir APK o template.db</button><button class="btn" id="save">Descargar template.db editado</button><small class="muted">La base de datos permanece solo en esta sesión del navegador.</small></div></aside><main class="main"><header class="top"><span>Proyecto / <b id="crumb">Equipos</b></span><span id="filename" class="muted">Ningún archivo</span></header><section class="content" id="content"></section><footer class="status" id="status">Abre tu APK o template.db para comenzar. El sitio no empaqueta ni firma el APK.</footer></main></div>
<input type="file" id="file" accept=".apk,.db,.sqlite,.sqlite3" hidden><div class="modal" id="modal"><section class="box"><header><b id="modalTitle">Editar registro</b><button class="btn" id="x">Cerrar</button></header><form id="form"><div class="fields" id="fields"></div><footer><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Guardar en la base de datos</button></footer></form></section></div>
<script>
const $=s=>document.querySelector(s);let SQL=null,db=null,mainDb=null,zip=null,kind='Club',rows=[],schema=[],editing=null,sortCol=null,sortDesc=false;const config={Club:{id:'id',name:'name',cols:['id','name','countryID','ratingOVR','ratingDF','ratingMF','ratingFW','StadiumID']},Competition:{id:'id',name:'Name',cols:['id','Name','RealName','CountryID','ContinentID','UserPlayable','Type','ImportanceOrder','StartYear','Recurring']},Player:{id:'ID',name:'Name',cols:['ID','Name','ClubID','CountryID','Number','Rating','RatingPotential','PositionNumber']}};
function say(t){$('#status').textContent=t}function setBusy(t){say(t)}function quote(s){return '"'+String(s).replaceAll('"','""')+'"'}function tableExists(n){return db.exec("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",[n]).length>0}function allTables(){return db.exec("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")[0]?.values.map(x=>x[0])||[]}
async function initSql(){if(!SQL)SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f})}
async function loadFile(file){try{setBusy('Leyendo archivo…');await initSql();zip=null;mainDb=null;if(/\.apk$/i.test(file.name)){zip=await JSZip.loadAsync(file);const t=zip.file('assets/template.db');if(!t)throw Error('No se encontró assets/template.db en este APK.');db=new SQL.Database(new Uint8Array(await t.async('uint8array')));const m=zip.file('assets/main.db');if(m)mainDb=new SQL.Database(new Uint8Array(await m.async('uint8array')))}else{db=new SQL.Database(new Uint8Array(await file.arrayBuffer()))}if(!tableExists('Club')||!tableExists('Player')||!tableExists('Competition'))throw Error('La base de datos no contiene las tablas esperadas Club, Player y Competition.');$('#filename').textContent=file.name;kind='Club';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));render();say('Base de datos cargada. Los cambios solo están en el navegador.');}catch(e){db=null;alert('No se pudo abrir el archivo: '+e.message);say('No se pudo abrir la base de datos.')}}
function render(){if(!db)return;$('#crumb').textContent=kind==='access'?'Ascensos y plazas':({Club:'Equipos',Competition:'Competiciones',Player:'Jugadores'}[kind]);if(kind==='access'){renderAccess();return}const q=($('#search')?.value||'').trim(),filterCol=($('#filterCol')?.value||'').trim(),filterValue=($('#filterValue')?.value||'').trim(),c=config[kind];let info=db.exec('PRAGMA table_info('+quote(kind)+')')[0];schema=info.values.map(x=>({name:x[1],type:x[2]||'',pk:x[5]}));let cols=schema.map(s=>s.name);let sql='SELECT '+cols.map(quote).join(',')+' FROM '+quote(kind),conds=[],params=[];if(q){conds.push('CAST('+quote(c.name)+' AS TEXT) LIKE ?');params.push('%'+q+'%')}if(filterCol&&filterValue){if(!schema.some(s=>s.name===filterCol)){say('Selecciona una columna válida.');return}conds.push('CAST('+quote(filterCol)+' AS TEXT) LIKE ?');params.push('%'+filterValue+'%')}if(conds.length)sql+=' WHERE '+conds.join(' AND ');sql+=' ORDER BY '+quote(sortCol||c.name)+(sortDesc?' DESC':' ASC')+' LIMIT 3000';let res=db.exec(sql,params)[0],data=res?.values||[];rows=data;let header=cols.map(col=>'<th data-col="'+esc(col)+'">'+esc(col)+(col===sortCol?(sortDesc?' ↓':' ↑'):'')+'</th>').join('');let body=data.map((r,i)=>'<tr>'+r.map(v=>'<td title="'+esc(v)+'">'+esc(v)+'</td>').join('')+'<td class="rowactions"><button class="btn" data-edit="'+i+'">Editar</button><button class="btn" data-del="'+i+'">Eliminar</button></td></tr>').join('');$('#content').innerHTML='<div class="head"><div><h1>'+$('#crumb').textContent+'</h1><small class="muted">'+data.length+' registros mostrados (límite 3000)</small></div><button class="btn primary" id="add">＋ Añadir</button></div><div class="toolbar"><input id="search" class="input" placeholder="Buscar por nombre…" value="'+esc(q)+'">'+(schema.length?'<select id="filterCol" class="input">'+schema.map(s=>'<option value="'+esc(s.name)+'" '+(s.name===(filterCol||schema.find(x=>x.name.toLowerCase()==='countryid')?.name||schema[0].name)?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select><input id="filterValue" class="input" style="width:180px" placeholder="Filtrar valor…" value="'+esc(filterValue)+'">':'')+'</div><div class="tablebox"><table class="table"><thead><tr>'+header+'<th>Acciones</th></tr></thead><tbody>'+body+'</tbody></table></div>';
const bindFilter=(id)=>$('#'+id).oninput=e=>{const pos=e.target.selectionStart,value=e.target.value;render();const again=$('#'+id);again.focus();again.setSelectionRange(pos,pos)};bindFilter('search');if($('#filterValue'))bindFilter('filterValue');if($('#filterCol'))$('#filterCol').onchange=()=>render();$('#add').onclick=()=>editRow(null);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editRow(+b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRow(+b.dataset.del));document.querySelectorAll('th[data-col]').forEach(h=>h.onclick=()=>{sortDesc=sortCol===h.dataset.col?!sortDesc:false;sortCol=h.dataset.col;render()})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editRow(idx){const c=config[kind],existing=idx!==null,vals=existing?rows[idx]:null;editing={id:existing?vals[0]:null};let src=existing?Object.fromEntries(schema.map((s,i)=>[s.name,vals[i]??''])):{};if(!existing){const r=db.exec('SELECT * FROM '+quote(kind)+' LIMIT 1')[0];if(r)src=Object.fromEntries(r.columns.map((x,i)=>[x,r.values[0][i]]));schema.forEach(s=>{if(s.pk)src[s.name]='';});}
$('#modalTitle').textContent=existing?'Editar '+kind:'Añadir '+kind+' (copiando un registro de modelo)';$('#fields').innerHTML=schema.map(s=>'<label class="field"><span>'+esc(s.name)+(s.type?' · '+esc(s.type):'')+'</span><input class="input" name="'+esc(s.name)+'" value="'+esc(src[s.name])+'" '+(s.pk&&!existing?'placeholder="gerado pelo SQLite"':'')+'></label>').join('');$('#modal').classList.add('open')}
$('#form').onsubmit=e=>{e.preventDefault();try{let form=Object.fromEntries(new FormData(e.target)),idcol=config[kind].id;if(editing.id!==null){let keys=Object.keys(form).filter(k=>k!==idcol);db.run('UPDATE '+quote(kind)+' SET '+keys.map(k=>quote(k)+'=?').join(',')+' WHERE '+quote(idcol)+'=?',[...keys.map(k=>form[k]),editing.id])}else{let keys=Object.keys(form).filter(k=>!(schema.find(s=>s.name===k)?.pk)&&form[k]!=='');db.run('INSERT INTO '+quote(kind)+' ('+keys.map(quote).join(',')+') VALUES ('+keys.map(()=>'?').join(',')+')',keys.map(k=>form[k]))}$('#modal').classList.remove('open');render();say('Cambio guardado en la base de datos en memoria. Descarga template.db para conservarlo.')}catch(err){alert('Error al guardar: '+err.message)}};
function deleteRow(idx){const idcol=config[kind].id,id=rows[idx][0];if(!confirm('Eliminar '+kind+' '+id+'?'))return;db.run('DELETE FROM '+quote(kind)+' WHERE '+quote(idcol)+'=?',[id]);render();say('Registro eliminado de la base de datos en memoria.')}
function renderAccess(){const countries=mainDb&&mainDb.exec('SELECT ID,Name FROM Country ORDER BY Name')[0]?.values||[];const stages=db.exec('SELECT s.id,s.CompetitionID,s.Name,s.FullName,c.Name,c.CountryID,c.ContinentID FROM CompetitionStage s JOIN Competition c ON c.id=s.CompetitionID ORDER BY c.CountryID,c.Name,s.id')[0]?.values||[];$('#content').innerHTML='<div class="head"><div><h1>Ascensos y plazas</h1><small class="muted">Añade reglas CompetitionStageTransition a template.db.</small></div></div><div class="notice">Usa esta función si conoces la estructura de la base de datos. La selección utiliza las etapas disponibles en el APK y crea transiciones según la posición.</div><div class="card"><h3>Criar transição</h3><div class="fields"><label class="field"><span>Etapa de origen</span><select class="input" id="from">'+stages.map(s=>'<option value="'+s[0]+'">countryID '+s[5]+' · '+esc(s[4])+' / '+esc(s[3]||s[2]||'Etapa')+' [#'+s[0]+']</option>').join('')+'</select></label><label class="field"><span>Etapa de destino</span><select class="input" id="to">'+stages.map(s=>'<option value="'+s[0]+'">countryID '+s[5]+' · '+esc(s[4])+' / '+esc(s[3]||s[2]||'Etapa')+' [#'+s[0]+']</option>').join('')+'</select></label><label class="field"><span>Posición inicial</span><input class="input" type="number" min="1" id="place" value="1"></label><label class="field"><span>Número de plazas</span><input class="input" type="number" min="1" id="count" value="1"></label></div><button class="btn primary" id="transition">Añadir transição</button></div><div class="notice" style="margin-top:14px">Para crear ascensos y descensos, añade dos transiciones: de la división inferior a la superior y de la superior a la inferior. Esta pantalla no calcula las posiciones en tiempo real.</div>';
$('#transition').onclick=()=>{try{if(!tableExists('CompetitionStageTransition'))throw Error('No se encontró la tabla CompetitionStageTransition.');let a=+$('#from').value,b=+$('#to').value,p=+$('#place').value,n=+$('#count').value;if(!a||!b||a===b||p<1||n<1)throw Error('Revisa las etapas, la posición y la cantidad.');for(let i=p;i<p+n;i++)db.run('INSERT INTO CompetitionStageTransition (CompetitionStageID_From,CompetitionStageID_To,Place,Type,OtherInfo) SELECT ?,?,?,0,NULL WHERE NOT EXISTS (SELECT 1 FROM CompetitionStageTransition WHERE CompetitionStageID_From=? AND CompetitionStageID_To=? AND Place=? AND Type=0)',[a,b,i,a,b,i]);say('Transiciones añadidas. Descarga template.db para guardar.')}catch(e){alert(e.message)}}}
function saveDb(){if(!db){alert('Abra um APK ou banco antes.');return}const blob=new Blob([db.export()],{type:'application/x-sqlite3'});download(blob,'template-editado.db');say('Se descargó template-editado.db. Para usarlo en el juego, debes reemplazar la base de datos en el APK y firmarlo localmente.')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#open').onclick=()=>$('#file').click();$('#file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''};$('#save').onclick=saveDb;$('#x').onclick=$('#cancel').onclick=()=>$('#modal').classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
</script></body></html>
